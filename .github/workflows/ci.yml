name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet restore GolfStatsApp.slnx
      - run: dotnet build GolfStatsApp.slnx --no-restore -c Release
      - run: dotnet test Tests/GolfStatsApp.Tests.csproj --no-build -c Release
