<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5d3b" />
    <title>GolfStatsApp</title>
    <base href="/" />
    <script>
        // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
        (function () {
            var saved = localStorage.getItem('golf-theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="GolfStatsApp.Client.styles.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="spinner-border text-success" role="status"></div>
            <span>Loading Golf Stats...</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#x2715;</a>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (function () {
            function startBlazor() { Blazor.start(); }
            if (!('serviceWorker' in navigator)) { startBlazor(); return; }
            var isLocal = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) >= 0;
            if (!isLocal) {
                navigator.serviceWorker.register('service-worker.js');
                startBlazor();
                return;
            }
            // Local dev: a previously installed (published) worker can serve a stale cached index.html, which
            // shows a blank page until refresh. Remove workers/caches BEFORE Blazor starts so a reload (if needed)
            // never interrupts a running app or the WebAssembly debugger.
            var servedByWorker = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.getRegistrations()
                .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
                .then(function () { return window.caches ? caches.keys() : []; })
                .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
                .catch(function () { })
                .then(function () {
                    if (servedByWorker && !sessionStorage.getItem('sw-cleared')) {
                        sessionStorage.setItem('sw-cleared', '1');
                        location.reload();
                        return;
                    }
                    startBlazor();
                });
        })();
    </script>
</body>

</html>
